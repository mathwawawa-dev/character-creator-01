<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Character Studio</title>
  <style>
    :root {
      --bg: #1a1c29;
      --panel: #2a2d40;
      --accent: #ff4757;
      --text: #ffffff;
      --dim: #a4b0be;
      --border: #3d425c;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Start Screen */
    #startScreen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #1a1c29 0%, #0d0f17 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.5s ease;
    }

    .start-title {
      font-size: 3rem;
      font-weight: 900;
      margin-bottom: 10px;
      text-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
    }
    .start-sub {
      color: var(--dim);
      margin-bottom: 50px;
    }

    .mode-cards {
      display: flex;
      gap: 30px;
    }

    .card {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 40px 30px;
      width: 320px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(255, 71, 87, 0.2);
    }
    .card h2 { margin-bottom: 15px; font-size: 1.5rem; }
    .card p { color: var(--dim); font-size: 0.95rem; line-height: 1.5; }
    .card-icon { font-size: 3rem; margin-bottom: 20px; }

    /* App Container (Hidden initially) */
    #appContainer {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    header {
      background: var(--panel);
      padding: 15px 24px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1.2rem; display: flex; align-items: center; gap: 10px;}
    .btn-home {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-home:hover { background: var(--border); }

    .workspace {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--dim);
    }

    /* Footer / Version Stamp */
    .version-stamp {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <!-- Start Screen -->
  <div id="startScreen">
    <div class="start-title">✨ Pixel Studio</div>
    <div class="start-sub">차세대 픽셀 캐릭터 제너레이터</div>
    
    <div class="mode-cards">
      <div class="card" onclick="selectMode('ai')">
        <div class="card-icon">🧠</div>
        <h2>통합 AI 생성 모드</h2>
        <p>프롬프트 입력을 통해 베이스 캐릭터와 모션 스프라이트 시트를 한 번에 생성합니다.</p>
      </div>
      <div class="card" onclick="selectMode('spum')">
        <div class="card-icon">🧩</div>
        <h2>파츠 조립 모드</h2>
        <p>머리, 몸통, 무기 등 세밀한 레이어 파츠를 조립하여 나만의 캐릭터를 구성합니다.</p>
      </div>
    </div>
  </div>

  <!-- App Container (Editor) -->
  <div id="appContainer">
    <header>
      <h1 id="headerTitle">✨ Pixel Studio</h1>
      <button class="btn-home" onclick="goHome()">🏠 처음으로</button>
    </header>
    <div class="workspace" id="workspaceContent">
      <!-- Editor content will be injected here -->
      선택된 모드의 에디터 화면이 로드됩니다.
    </div>
  </div>

  <!-- Version Stamp -->
  <div class="version-stamp" id="versionStamp">v0.0.1_20260820_0245_step1_init</div>

  <script>
    function selectMode(mode) {
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('appContainer').style.display = 'flex';
      
      const title = document.getElementById('headerTitle');
      const ws = document.getElementById('workspaceContent');
      
      if(mode === 'ai') {
        title.innerHTML = '🧠 통합 AI 생성 모드 (Prompt-to-Sprite)';
        ws.innerHTML = 'AI 생성 모드 UI 준비중... (Step 4 예정)';
      } else {
        title.innerHTML = '🧩 파츠 조립 모드 (SPUM Style)';
        ws.innerHTML = '파츠 조립 모드 UI 준비중... (Step 2 예정)';
      }
    }

    function goHome() {
      document.getElementById('appContainer').style.display = 'none';
      document.getElementById('startScreen').style.display = 'flex';
    }
  </script>
</body>
</html>
