<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도트 슬라임 생성기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>스타팅 슬라임 선택</h1>
        <div class="canvas-container">
            <canvas id="slimeCanvas" width="32" height="32"></canvas>
        </div>
        <div class="controls">
            <div class="control-group">
                <label for="bodySelect">바디 타입:</label>
                <select id="bodySelect">
                    <option value="0">클래식</option>
                    <option value="1">물방울</option>
                    <option value="2">넓적한</option>
                    <option value="3">삐죽한</option>
                    <option value="4">불꽃형 (스페셜)</option>
                    <option value="5">물형 (스페셜)</option>
                    <option value="6">풀형 (스페셜)</option>
                    <option value="7">번개형 (스페셜)</option>
                    <option value="8">바위형 (스페셜)</option>
                    <option value="9">얼음형 (스페셜)</option>
                    <option value="10">어둠형 (스페셜)</option>
                    <option value="11">빛형 (스페셜)</option>
                    <option value="12">바람형 (스페셜)</option>
                </select>
            </div>
            <div class="control-group">
                <label>눈 위치(X,Y):</label>
                <div style="display:flex; gap:5px;">
                    <button id="eyeUpBtn" style="padding:2px 6px;">⬆️</button>
                    <button id="eyeDownBtn" style="padding:2px 6px;">⬇️</button>
                    <button id="eyeLeftBtn" style="padding:2px 6px;">⬅️</button>
                    <button id="eyeRightBtn" style="padding:2px 6px;">➡️</button>
                </div>
            </div>
            <div class="control-group">
                <label for="eyeSelect">눈 타입:</label>
                <select id="eyeSelect">
                    <option value="0">기본</option>
                    <option value="1">점</option>
                    <option value="2">화난 눈</option>
                    <option value="3">큰 눈</option>
                    <option value="4">감은 눈</option>
                    <option value="5">게슴츠레</option>
                    <option value="6">외눈</option>
                </select>
            </div>
            <div class="control-group">
                <label for="slimeColor">바디 색상:</label>
                <input type="color" id="slimeColor" value="#00ff00">
            </div>
            <button id="generateBtn">🎲 모두 랜덤</button>
        </div>
        
        <div class="version-info">
            v1.0.4_20260820_0443_fix_blank_canvas_bug
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
